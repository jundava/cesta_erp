<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
    .card-blocked { max-width: 500px; width: 100%; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #dc3545; }
    .loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:10; display:none; flex-direction:column; justify-content:center; align-items:center; }
  </style>
</head>
<body>

  <div class="card card-blocked">
    <div class="loading-overlay" id="loader">
       <div class="spinner-border text-danger mb-2" role="status"></div>
       <div class="fw-bold text-secondary">Procesando pago...</div>
    </div>

    <div class="card-body p-4 text-center">
      <div class="mb-3">
        <span style="font-size: 3rem;">🚫</span>
      </div>
      <h3 class="fw-bold text-danger mb-2">Suscripción Vencida</h3>
      <p class="text-muted mb-4">Para continuar utilizando el sistema, por favor regulariza tu pago pendiente.</p>
      
      <div class="bg-light p-3 rounded border mb-4 text-start">
         <div class="d-flex justify-content-between mb-2">
            <span class="fw-bold">Cliente:</span>
            <span id="emailCliente"><?= userEmail ?></span>
         </div>
         <div class="d-flex justify-content-between mb-2">
            <span>Vencimiento:</span>
            <span id="fechaVencimiento" class="fw-bold text-danger">Cargando...</span>
         </div>
         <div class="d-flex justify-content-between border-top pt-2">
            <span class="fs-5 fw-bold">Total a Pagar:</span>
            <span id="montoAdeudado" class="fs-5 fw-bold text-success">---</span>
         </div>
      </div>

      <hr>

      <form id="formPago" onsubmit="enviarPago(event)">
        <h6 class="text-start fw-bold mb-3"><i class="bi bi-credit-card"></i> Informar Pago</h6>
        
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Método de Pago</label>
            <select class="form-select" id="metodoPago" required>
                <option value="TRANSFERENCIA">Transferencia Bancaria</option>
            </select>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Nro. Comprobante / Referencia</label>
            <input type="text" class="form-control" id="referenciaPago" required placeholder="Ej: 1234567">
        </div>

        <div class="mb-4 text-start">
            <label class="form-label small fw-bold">Subir Comprobante (Foto/PDF)</label>
            <input type="file" class="form-control" id="archivoComprobante" accept="image/*,application/pdf" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-danger fw-bold py-2">
                Remitir Comprobante
            </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    // Variables globales
    let datosSuscripcion = null;
    const emailUsuario = '<?= userEmail ?>';

    // 1. Cargar datos al iniciar
    window.onload = function() {
        document.getElementById('loader').style.display = 'flex';
        google.script.run
            .withSuccessHandler(mostrarDatos)
            .withFailureHandler(manejarError)
            .verificarEstadoSuscripcion(emailUsuario);
    };

    function mostrarDatos(estado) {
        document.getElementById('loader').style.display = 'none';
        datosSuscripcion = estado; // Guardamos en variable global

        if (!estado || !estado.existe) {
            document.getElementById('fechaVencimiento').innerText = "No encontrada";
            return;
        }

        // Formatear Fecha
        let fecha = new Date();
        if(estado.fechaVencimiento) fecha = new Date(estado.fechaVencimiento);
        document.getElementById('fechaVencimiento').innerText = fecha.toLocaleDateString('es-PY');
        
        // Formatear Monto
        const monto = Number(estado.monto) || 0;
        document.getElementById('montoAdeudado').innerText = '₲ ' + monto.toLocaleString('es-PY');
    }

    function manejarError(e) {
        document.getElementById('loader').style.display = 'none';
        console.error(e);
        Swal.fire('Error', 'No se pudieron cargar los datos.', 'error');
    }

    // 2. Función Principal: ENVIAR PAGO
    function enviarPago(e) {
        e.preventDefault(); // Evitar recarga del form HTML

        if (!datosSuscripcion) return Swal.fire('Error', 'No hay datos de suscripción cargados.', 'warning');

        const fileInput = document.getElementById('archivoComprobante');
        if (fileInput.files.length === 0) return Swal.fire('Atención', 'Debes adjuntar el comprobante.', 'warning');

        const archivo = fileInput.files[0];
        const metodo = document.getElementById('metodoPago').value;
        const referencia = document.getElementById('referenciaPago').value;
        
        // Mostrar Loader
        document.getElementById('loader').style.display = 'flex';

        // A. Leer archivo como Base64
        const reader = new FileReader();
        reader.readAsDataURL(archivo);
        
        reader.onload = function(evento) {
            const rawBase64 = evento.target.result.split(',')[1]; // Quitamos el "data:image/..."
            
            // B. Subir Archivo a Drive (Backend)
            google.script.run
                .withSuccessHandler(function(urlImagen) {
                    
                    // C. Registrar Pago en Sheet (Backend)
                    const paquetePago = {
                        id_suscripcion: datosSuscripcion.id_suscripcion,
                        monto: datosSuscripcion.monto,
                        metodo_pago: metodo,
                        referencia_transaccion: referencia,
                        banco_origen: 'No especificado', // Opcional: agregar input si quieres
                        comprobante_url: urlImagen,
                        email_usuario: emailUsuario,
                        observaciones: 'Pago desde pantalla de bloqueo'
                    };

                    google.script.run
                        .withSuccessHandler(function(res) {
                            document.getElementById('loader').style.display = 'none';
                            
                            Swal.fire({
                                title: '¡Pago Enviado!',
                                text: 'Tu comprobante está en revisión. Te notificaremos cuando se habilite el acceso.',
                                icon: 'success',
                                confirmButtonText: 'Entendido'
                            }).then(() => {
                                // Opcional: Intentar recargar para ver si ya se desbloqueó (aunque suele ser manual)
                                location.reload(); 
                            });
                        })
                        .withFailureHandler(function(err) {
                            document.getElementById('loader').style.display = 'none';
                            Swal.fire('Error', 'No se pudo registrar el pago: ' + err, 'error');
                        })
                        .registrarPago(paquetePago);

                })
                .withFailureHandler(function(err) {
                    document.getElementById('loader').style.display = 'none';
                    Swal.fire('Error', 'Fallo al subir la imagen: ' + err, 'error');
                })
                .subirComprobanteDrive(rawBase64, archivo.name, archivo.type);
        };

        reader.onerror = function() {
            document.getElementById('loader').style.display = 'none';
            Swal.fire('Error', 'No se pudo leer el archivo local.', 'error');
        };
    }
    
  </script>
</body>
</html>
