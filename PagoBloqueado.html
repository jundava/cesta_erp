<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Bloqueado - Cesta ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card-bloqueado {
            max-width: 500px;
            width: 100%;
            margin: 20px;
        }
        .icon-bloqueado {
            font-size: 4rem;
            color: #dc3545;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="card card-bloqueado shadow-lg border-0">
        <div class="card-body p-5 text-center">
            <!-- Icono -->
            <div class="mb-4">
                <i class="bi bi-shield-fill-exclamation icon-bloqueado"></i>
            </div>
            
            <!-- Título -->
            <h2 class="text-danger fw-bold mb-2">
                <i class="bi bi-slash-circle me-2"></i>Acceso Bloqueado
            </h2>
            <p class="text-muted mb-4">Suscripción Vencida</p>
            
            <!-- Datos de la Suscripción -->
            <div class="alert alert-warning text-start">
                <div class="row mb-2">
                    <div class="col-6 fw-bold">Fecha de vencimiento:</div>
                    <div class="col-6" id="fechaVencimiento">Cargando...</div>
                </div>
                <div class="row mb-2">
                    <div class="col-6 fw-bold">Días vencidos:</div>
                    <div class="col-6 text-danger fw-bold" id="diasVencidos">...</div>
                </div>
                <div class="row">
                    <div class="col-6 fw-bold">Monto adeudado:</div>
                    <div class="col-6 text-success fw-bold" id="montoAdeudado">₲ ...</div>
                </div>
            </div>
            
            <!-- Mensaje -->
            <p class="text-muted mb-4">
                Para recuperar el acceso a tu cuenta, realiza el pago de tu suscripción.
                Una vez confirmado, tu acceso será <strong>restablecido inmediatamente</strong>.
            </p>
            
            <!-- Botones -->
            <div class="d-grid gap-2">
                <button class="btn btn-danger btn-lg fw-bold" onclick="abrirPagoSuscripcion()">
                    <i class="bi bi-credit-card me-2"></i>Realizar Pago Ahora
                </button>
                <a href="mailto:soporte@cestaerp.com" class="btn btn-outline-secondary">
                    <i class="bi bi-envelope me-2"></i>Contactar Soporte
                </a>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // RECIBIR DATOS DEL SERVIDOR
        // ========================================
        
        // Esta función se ejecuta automáticamente cuando se carga la página
        google.script.run
            .withSuccessHandler(cargarDatosSuscripcion)
            .withFailureHandler(errorCargando)
            .verificarEstadoSuscripcion('<?= userEmail ?>'); // El email viene del servidor
        
        function cargarDatosSuscripcion(estado) {
            // Validar que recibimos datos
            if (!estado || !estado.existe) {
                document.getElementById('fechaVencimiento').textContent = 'No disponible';
                document.getElementById('diasVencidos').textContent = 'N/A';
                document.getElementById('montoAdeudado').textContent = '₲ 0';
                return;
            }
            
            // Mostrar datos
            const fechaVenc = new Date(estado.fechaVencimiento);
            document.getElementById('fechaVencimiento').textContent = fechaVenc.toLocaleDateString('es-PY');
            
            const diasVencidos = Math.abs(estado.diasVencimiento);
            document.getElementById('diasVencidos').textContent = diasVencidos + ' días';
            
            const monto = Number(estado.monto) || 0;
            document.getElementById('montoAdeudado').textContent = '₲ ' + monto.toLocaleString('es-PY');
        }
        
        function errorCargando(error) {
            console.error('Error cargando datos:', error);
            document.getElementById('fechaVencimiento').textContent = 'Error al cargar';
            document.getElementById('diasVencidos').textContent = '---';
            document.getElementById('montoAdeudado').textContent = '---';
        }
        
        function abrirPagoSuscripcion() {
            // Redirigir a la pantalla de pago (implementar según tu flujo)
            alert('Redirigiendo a métodos de pago...');
            // Aquí podrías abrir un modal o redirigir a otra página
        }
    </script>
</body>
</html>
